<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 134" width="128" height="172" role="img" aria-labelledby="t d">
<title id="t">품싹 — 128px 축약형</title>
<desc id="d">수첩 속지와 볼 원을 생략한 중간 사이즈 전용 버전. 잎맥 1줄은 유지</desc>
<defs>
  <linearGradient id="bodyGrad" x1="0" y1="59" x2="0" y2="89" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#BFD72F"/>
    <stop offset="1" stop-color="#95C93D"/>
  </linearGradient>
  <!-- 왼팔 형상 = 두 팔 겹침 구간 추출용 마스크 -->
  <mask id="armCross" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="134">
    <rect x="0" y="0" width="100" height="134" fill="#000"/>
    <path d="M34,74 C26.5,84 26.5,98 33,105.5 C37.5,110.5 46,111.5 53,109.5" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  </mask>
</defs>

<!-- ───────── 1. 흰색 보조 외곽선 (다크 배경 판독성) ───────── -->
<g stroke="#fff" fill="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
  <!-- 떡잎 2장 -->
  <path d="M32,61 C22,54 13,43 11,30 C10,23.5 14,20.5 18.5,23.5 C23,30 28,42 33,52 C35,56 34,60 32,61 Z"/>
  <path d="M65,62 C70,56 77,51.5 82,52.5 C85,53 85,56.5 82,58.5 C78,61 72,63.5 68,66.5 C66,68 64,65 65,62 Z"/>
  <!-- 몸통 -->
  <path d="M50,59 C61,59 67.5,64.5 68.8,72.5 C69.5,77.5 69,81 66.5,84 C64,87 57.5,88.5 50,88.5 C42.5,88.5 36,87 33.5,84 C31,81 30.5,77.5 31.2,72.5 C32.5,64.5 39,59 50,59 Z"/>
  <!-- 두 팔 -->
  <path d="M34,74 C26.5,84 26.5,98 33,105.5 C37.5,110.5 46,111.5 53,109.5" fill="none" stroke-width="13.8"/>
  <path d="M66,74 C73.5,84 73.5,98 67,105.5 C62.5,110.5 54,111.5 47,109.5" fill="none" stroke-width="13.8"/>
  <!-- 머리 -->
  <circle cx="50" cy="44" r="21"/>
  <!-- 수첩 -->
  <path d="M72,73 H80 A3.5,3.5 0 0 1 83.5,76.5 V85 A2.5,2.5 0 0 1 81,87.5 H72 A2.5,2.5 0 0 1 69.5,85 V75.5 A2.5,2.5 0 0 1 72,73 Z"/>
</g>

<!-- ───────── 2. 떡잎 (몸통·머리 뒤 / 좌우 비대칭이 A안의 핵심) ───────── -->
<g stroke="#004B88" stroke-width="2.2" stroke-linejoin="round" fill="#AED136">
  <!-- 왼쪽 = 남을 덮는 잎 : 길다 -->
  <path d="M32,61 C22,54 13,43 11,30 C10,23.5 14,20.5 18.5,23.5 C23,30 28,42 33,52 C35,56 34,60 32,61 Z"/>
  <!-- 오른쪽 = 자기를 감싸는 잎 : 왼쪽의 약 60% 길이, 어깨 위에 접혀 내려앉아 있다 -->
  <path d="M65,62 C70,56 77,51.5 82,52.5 C85,53 85,56.5 82,58.5 C78,61 72,63.5 68,66.5 C66,68 64,65 65,62 Z"/>
</g>
<!-- 잎맥 1줄씩 + 오른쪽 잎 접힘 주름 1줄 -->
<g fill="none" stroke="#004B88" stroke-linecap="round" opacity="0.45">
  <path d="M31.5,58 C24,50.5 17,40 15.5,28.5" stroke-width="1.3"/>
  <path d="M66,64 C70.5,58.5 76,55 80,54.5" stroke-width="1.3"/>
  <path d="M74,53.5 C75.5,55.5 75,58 72.5,60.5" stroke-width="1.6" opacity="0.85"/>
</g>

<!-- ───────── 3. 몸통 ───────── -->
<path d="M50,59 C61,59 67.5,64.5 68.8,72.5 C69.5,77.5 69,81 66.5,84 C64,87 57.5,88.5 50,88.5 C42.5,88.5 36,87 33.5,84 C31,81 30.5,77.5 31.2,72.5 C32.5,64.5 39,59 50,59 Z" fill="url(#bodyGrad)" stroke="#004B88" stroke-width="2.2" stroke-linejoin="round"/>

<!-- ───────── 4. 두 팔 — CI 요람 곡선 (★ 핵심 / 안쪽 빈 공간 = 품) ───────── -->
<path d="M34,74 C26.5,84 26.5,98 33,105.5 C37.5,110.5 46,111.5 53,109.5" fill="none" stroke="#004B88" stroke-width="11.4" stroke-linecap="round"/>
<path d="M34,74 C26.5,84 26.5,98 33,105.5 C37.5,110.5 46,111.5 53,109.5" fill="none" stroke="#95C93D" stroke-width="7" stroke-linecap="round"/>
<path d="M66,74 C73.5,84 73.5,98 67,105.5 C62.5,110.5 54,111.5 47,109.5" fill="none" stroke="#004B88" stroke-width="11.4" stroke-linecap="round"/>
<path d="M66,74 C73.5,84 73.5,98 67,105.5 C62.5,110.5 54,111.5 47,109.5" fill="none" stroke="#95C93D" stroke-width="7" stroke-linecap="round"/>
<!-- 두 팔이 맞물리는 지점 : CI 겹침색 필수 적용 -->
<g mask="url(#armCross)">
  <path d="M66,74 C73.5,84 73.5,98 67,105.5 C62.5,110.5 54,111.5 47,109.5" fill="none" stroke="#54B947" stroke-width="7" stroke-linecap="round"/>
</g>

<!-- ───────── 5. 허리춤 수첩 (CI 오렌지 인물의 소품 치환 계승) ───────── -->
<path d="M67,68.5 C69,69.5 70.5,71 71.5,73" fill="none" stroke="#004B88" stroke-width="2" stroke-linecap="round"/>
<path d="M72,73 H80 A3.5,3.5 0 0 1 83.5,76.5 V85 A2.5,2.5 0 0 1 81,87.5 H72 A2.5,2.5 0 0 1 69.5,85 V75.5 A2.5,2.5 0 0 1 72,73 Z" fill="#F8991C" stroke="#004B88" stroke-width="2.2" stroke-linejoin="round"/>

<!-- ───────── 6. 머리 · 얼굴 ───────── -->
<circle cx="50" cy="44" r="21" fill="#BFD72F" stroke="#004B88" stroke-width="2.2"/>
<ellipse cx="41" cy="44" rx="3.5" ry="4.5" fill="#004B88" transform="rotate(2 41 44)"/>
<ellipse cx="59" cy="44" rx="3.5" ry="4.5" fill="#004B88" transform="rotate(-2 59 44)"/>
<circle cx="42.3" cy="41.8" r="1.2" fill="#fff"/>
<circle cx="60.3" cy="41.8" r="1.2" fill="#fff"/>
<path d="M44.5,53.5 Q50,57 55.5,53.5" fill="none" stroke="#004B88" stroke-width="2.5" stroke-linecap="round"/>

<!-- ───────── 7. 흙더미 (두 팔 하단이 흙에 묻힌다 = 땅에 붙어 있는 새싹) ───────── -->
<path d="M18,126 C18,117 31,113 50,113 C69,113 82,117 82,126 Z" fill="#939598" opacity="0.3"/>
<path d="M27,126 C27,119 37,116.5 50,116.5 C63,116.5 73,119 73,126 Z" fill="#939598" opacity="0.35"/>
</svg>
